<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas e Estoque</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">GestãoFácil - Vendas & Estoque</h1>
        <span class="text-sm bg-blue-700 px-3 py-1 rounded">Módulo Front-end</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Cards de Resumo / Faturamento -->
        <div class="md:col-span-3 grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Faturamento Total</p>
                <h3 class="text-2xl font-bold text-gray-800" id="totalFaturamento">R$ 0,00</h3>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Produtos Cadastrados</p>
                <h3 class="text-2xl font-bold text-gray-800" id="totalProdutos">0</h3>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-orange-500">
                <p class="text-gray-500 text-sm">Vendas Realizadas</p>
                <h3 class="text-2xl font-bold text-gray-800" id="totalVendas">0</h3>
            </div>
        </div>

        <!-- Formulário de Cadastro / Entrada -->
        <div class="bg-white p-6 rounded-lg shadow md:col-span-1">
            <h2 class="text-lg font-bold mb-4 text-gray-700">Cadastrar Produto</h2>
            <form id="productForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Nome do Produto</label>
                    <input type="text" id="prodName" required class="w-full mt-1 p-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Preço (R$)</label>
                    <input type="number" step="0.01" id="prodPrice" required class="w-full mt-1 p-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Quantidade Inicial</label>
                    <input type="number" id="prodQty" required class="w-full mt-1 p-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Salvar Produto</button>
            </form>
        </div>

        <!-- Tabela de Estoque e Vendas -->
        <div class="bg-white p-6 rounded-lg shadow md:col-span-2">
            <h2 class="text-lg font-bold mb-4 text-gray-700">Controle de Estoque</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                            <th class="p-3">Produto</th>
                            <th class="p-3">Preço</th>
                            <th class="p-3">Estoque</th>
                            <th class="p-3">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody" class="text-sm text-gray-700">
                        <!-- Os produtos entram aqui dinamicamente via JS -->
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-400">Nenhum produto cadastrado ainda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script de lógica básica (Entrada e Listagem) -->
    <script>
        let products = [];

        const form = document.getElementById('productForm');
        const tableBody = document.getElementById('stockTableBody');
        const totalProductsEl = document.getElementById('totalProdutos');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('prodName').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const qty = parseInt(document.getElementById('prodQty').value);

            const newProduct = { id: Date.now(), name, price, qty };
            products.push(newProduct);

            updateUI();
            form.reset();
        });

        function updateUI() {
            tableBody.innerHTML = '';
            totalProductsEl.textContent = products.length;

            if (products.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">Nenhum produto cadastrado ainda.</td></tr>`;
                return;
            }

            products.forEach(p => {
                const row = document.createElement('tr');
                row.className = "border-b hover:bg-gray-50";
                row.innerHTML = `
                    <td class="p-3 font-medium">${p.name}</td>
                    <td class="p-3">R$ ${p.price.toFixed(2)}</td>
                    <td class="p-3">${p.qty} un</td>
                    <td class="p-3 flex gap-2">
                        <button onclick="sellProduct(${p.id})" class="bg-green-500 text-white px-2 py-1 rounded text-xs hover:bg-green-600">Vender</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function sellProduct(id) {
            const product = products.find(p => p.id === id);
            if (product && product.qty > 0) {
                product.qty -= 1;
                // Atualizar faturamento futuramente aqui
                updateUI();
            } else {
                alert('Estoque esgotado!');
            }
        }
    </script>
</body>
</html>
